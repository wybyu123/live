name: jsmpeg Sources

on:
  schedule:
    - cron: '11 22 * * *' 
  workflow_dispatch:

jobs:
  update-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 核心修改：关闭 cache，避免找不到 requirements.txt 报错
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: '' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium


      - name: Generate Playlist TXT and M3U
        run: |
          python py/generate_jsmpeg.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add py/valid_9003.txt live.txt live.m3u
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update IPTV sources and playlists [skip ci]" && git push)
