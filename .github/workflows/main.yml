name: IPTV Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天定时运行

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行阶段一脚本 (已知IP精准检测)
        run: |
          python py/check_stage1.py

      - name: 提交并推送最终结果到仓库
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add py/valid_9003.txt
          git commit -m "Auto-update IPTV valid IPs via two-stage scripts [skip ci]" || exit 0
          git push
