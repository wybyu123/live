name: Update IPTV Data

on:
  # 允许手动触发
  workflow_dispatch:
  # 设置定时任务（例如每天 UTC 时间 0点和12点运行一次，可根据需要调整 cron表达式）
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 运行抓取脚本
      run: |
        python py/generate_zhgxtv.py

    - name: 自动提交并推送更新到仓库
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff --staged --quiet || (git commit -m "Auto-update IPTV JSON data" && git push)
