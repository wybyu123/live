name: 运行 C段IP扫描

on:
  schedule:
    # 每天北京时间中午 12:00 自动运行一次 (UTC 04:00)
    - cron: '0 */12 * * *'
  workflow_dispatch: # 允许在 GitHub 页面手动点击运行

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 1. 检出当前代码库
        uses: actions/checkout@v4

      - name: 2. Python 环境准备
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖
        run: pip install requests urllib3

      - name: 4. 执行扫描脚本
        run: python -u py/scan.py
    


      - name: 5. 自动提交并推送扫描结果到当前仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. 先将所有新生成的文件暂存起来
          git add .
          
          # 2. 如果没有实质改动，直接退出；有改动则先储藏(stash)起来以便安全 pull
          if git diff --staged --quiet; then
            echo "✨ 扫描完成，结果无变动，跳过推送。"
            exit 0
          fi
          
          git stash
          
          # 3. 安全拉取远程更新（带 rebase）
          git pull origin main --rebase || echo "拉取远程失败或无冲突"
          
          # 4. 释放刚才储藏的改动
          git stash pop || echo "无 stash 可释放"
          
          # 5. 再次 add 并提交推送
          git add .
          git commit -m "自动更新 C段扫描存活结果: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
